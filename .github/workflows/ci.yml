name: TypeScript client CI

on:
  push:
    branches:
      - main
    paths:
      - "typescript/**"
      - "contracts/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "typescript/**"
      - "contracts/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"

jobs:
  build:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: typescript
        run: npm ci

      - name: Regenerate types and verify no drift
        working-directory: typescript
        run: |
          npm run generate
          git diff --exit-code -- packages/client/src/generated

      - name: Lint
        working-directory: typescript
        run: npm run lint

      - name: Typecheck
        working-directory: typescript
        run: npm run typecheck

      - name: Test
        working-directory: typescript
        run: npm test

      - name: Tree-shaking check
        working-directory: typescript
        run: npx vitest run packages/client/test/treeshake.test.ts

  e2e:
    name: End-to-end against a real server
    needs: build
    runs-on: ubuntu-latest
    # Container pull plus ArcadeDB JVM startup can run well past what the unit job ever needs;
    # a generous, explicit cap here keeps a hung container from burning the runner's default
    # multi-hour budget instead of failing fast.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # testcontainers@12 requires Node >= 22.22; the "build" job's Node 20 is unaffected,
          # this job runs independently with its own toolchain.
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: typescript
        run: npm ci

      - name: E2E tests against a real ArcadeDB server
        working-directory: typescript
        run: npm run e2e
