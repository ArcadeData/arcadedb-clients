name: TypeScript client CI

on:
  push:
    branches:
      - main
    paths:
      - "typescript/**"
      - "contracts/**"
      - "scripts/**"
      # Root files this workflow's own gates read. `generate:grpc` runs
      # `buf generate --template buf.gen.yaml ..`, so the root `buf.yaml` is the
      # module config the drift gate regenerates from - a change to it alters the
      # generated output while leaving every path above untouched. `.gitignore`
      # matters for the same reason: the drift gate's untracked-file half is a
      # `git status --porcelain` over the generated directories, which an ignore
      # rule covering them would silence permanently and invisibly.
      - "buf.yaml"
      - ".gitignore"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "typescript/**"
      - "contracts/**"
      - "scripts/**"
      # Root files this workflow's own gates read. `generate:grpc` runs
      # `buf generate --template buf.gen.yaml ..`, so the root `buf.yaml` is the
      # module config the drift gate regenerates from - a change to it alters the
      # generated output while leaving every path above untouched. `.gitignore`
      # matters for the same reason: the drift gate's untracked-file half is a
      # `git status --porcelain` over the generated directories, which an ignore
      # rule covering them would silence permanently and invisibly.
      - "buf.yaml"
      - ".gitignore"
      - ".github/workflows/ci.yml"

jobs:
  build:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: typescript
        run: npm ci

      - name: Regenerate types and verify no drift
        working-directory: typescript
        run: |
          npm run generate

          # Catches a MODIFIED generated file (existing path, changed content).
          git diff --exit-code -- packages/client/src/generated packages/client-grpc/src/gen

          # Catches a RENAMED generated file: `git diff` above is blind to untracked paths, and
          # the gRPC generated filename embeds the contract version
          # (arcadedb-server-<version>_pb.ts), so a contract refresh emits a NEW file beside the
          # old one rather than modifying it in place - the diff check alone would stay green
          # while src/index.ts kept importing the stale, now-orphaned file.
          if [[ -n "$(git status --porcelain -- packages/client/src/generated packages/client-grpc/src/gen)" ]]; then
            echo "Generated output changed (untracked and/or modified files below) - commit the regenerated output:" >&2
            git status --porcelain -- packages/client/src/generated packages/client-grpc/src/gen >&2
            exit 1
          fi

          # "Expected exactly one" check for the gRPC .proto contract, mirroring the one
          # scripts/fetch-contract.sh already has for the OpenAPI spec (fetch-contract.sh:170-174):
          # a second contracts/*.proto left behind by a version bump would silently make
          # `buf generate`'s glob pick up an unintended file, or leave stale output nobody notices.
          PROTO_COUNT=$(find ../contracts -maxdepth 1 -name '*.proto' | wc -l | tr -d '[:space:]')
          if [[ "$PROTO_COUNT" -ne 1 ]]; then
            echo "ERROR: expected exactly one contracts/*.proto, found $PROTO_COUNT:" >&2
            find ../contracts -maxdepth 1 -name '*.proto' >&2
            exit 1
          fi

      - name: Lint
        working-directory: typescript
        run: npm run lint

      - name: Typecheck
        working-directory: typescript
        run: npm run typecheck

      - name: Test
        working-directory: typescript
        run: npm test

      - name: Tree-shaking check
        working-directory: typescript
        run: npx vitest run packages/client/test/treeshake.test.ts

  e2e:
    name: End-to-end against a real server
    needs: build
    runs-on: ubuntu-latest
    # Container pull plus ArcadeDB JVM startup can run well past what the unit job ever needs;
    # a generous, explicit cap here keeps a hung container from burning the runner's default
    # multi-hour budget instead of failing fast.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # testcontainers@12 requires Node >= 22.22; the "build" job's Node 20 is unaffected,
          # this job runs independently with its own toolchain.
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: typescript
        run: npm ci

      - name: E2E tests against a real ArcadeDB server
        working-directory: typescript
        run: npm run e2e
